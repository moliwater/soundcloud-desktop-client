<!doctype html>
<html lang="en" data-theme="charcoal" data-accent="green">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src https: data: sfbg:; media-src https: blob:; connect-src https:; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>Soundfast</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="titlebar-drag"></div>
<div class="app">
  <aside class="sidebar" aria-label="Navigation">
    <div class="profile" id="profile"></div>
    <nav class="nav" id="nav-main"></nav>
    <div class="nav-label">Your library</div>
    <nav class="nav" id="nav-lib"></nav>
    <div class="spacer"></div>
    <nav class="nav bottom" id="nav-bottom"></nav>
  </aside>

  <main class="main">
    <div class="topbar">
      <div class="hist">
        <button id="back" title="Back (Alt+Left)" aria-label="Back"></button>
        <button id="fwd" title="Forward (Alt+Right)" aria-label="Forward"></button>
      </div>
      <div class="tabs" id="tabs" role="tablist"></div>
      <div class="grow"></div>
      <label class="searchbox"><span id="search-ico"></span><input id="search" type="search" placeholder="Search artists, tracks, playlists" autocomplete="off" spellcheck="false"></label>
    </div>
    <div class="view" id="view" tabindex="-1"></div>
    <div class="bottombar" id="bottombar" aria-label="Playback">
      <div class="bb-left">
        <button class="bb-art" id="bb-art" title="Show Now playing" aria-label="Show Now playing"></button>
        <div class="bb-text"><button class="bb-title" id="bb-title" title="Open track page">Nothing playing</button><a class="bb-artist" id="bb-artist" href="#"></a></div>
        <button class="bb-like" id="bb-like" title="Like" aria-label="Like"></button>
        <button class="bb-like bb-repost" id="bb-repost" title="Repost" aria-label="Repost"></button>
      </div>
      <div class="bb-center">
        <div class="bb-controls">
          <button id="bb-shuffle" title="Shuffle" aria-label="Shuffle"></button>
          <button id="bb-prev" title="Previous" aria-label="Previous track"></button>
          <button class="big" id="bb-play" title="Play" aria-label="Play"></button>
          <button id="bb-next" title="Next" aria-label="Next track"></button>
          <button id="bb-repeat" title="Repeat" aria-label="Repeat"></button>
        </div>
        <div class="bb-progress"><span id="bb-t1">0:00</span><div class="bb-bar" id="bb-bar" role="slider" aria-label="Seek" tabindex="0"><div class="bb-fill" id="bb-fill"></div><div class="bb-knob" id="bb-knob"></div></div><span id="bb-t2">0:00</span></div>
      </div>
      <div class="bb-right">
        <button id="bb-eq" class="fx-btn" title="Equalizer (Ctrl+Shift+E)" aria-label="Equalizer"></button>
        <button id="bb-speed" class="fx-btn" title="Speed and pitch (Ctrl+Shift+S)" aria-label="Speed and pitch"></button>
        <button id="bb-add" title="Add to playlist" aria-label="Add to playlist"></button>
        <button id="bb-comments" title="Comments" aria-label="Comments"></button>
        <button id="bb-vol-btn" title="Mute" aria-label="Mute"></button>
        <input type="range" id="bb-vol" min="0" max="1" step="0.01" value="1" aria-label="Volume">
        <button id="bb-mini" title="Mini player (Ctrl+M)" aria-label="Open mini player"></button>
        <button id="bb-open" title="Show Now playing" aria-label="Show Now playing"></button>
      </div>
    </div>
  </main>

  <aside class="player" aria-label="Now playing">
    <div class="player-head"><h2>Now playing</h2><button class="icon-btn" id="mini" title="Mini player (Ctrl+M)" aria-label="Open mini player"></button><button class="icon-btn" id="close-panel" title="Close Now playing (Ctrl+B)" aria-label="Close Now playing"></button></div>
    <div class="np-art empty" id="np-art"></div>
    <button class="np-title" id="np-title" title="Open track page">Nothing playing</button>
    <a class="np-artist" id="np-artist" href="#">Pick a track to start</a>
    <div class="wave"><span class="t1" id="t1">0:00</span><canvas id="wave" height="68"></canvas><span class="t2" id="t2">0:00</span></div>
    <div class="controls">
      <button id="shuffle" title="Shuffle" aria-label="Shuffle"></button>
      <button id="prev" title="Previous" aria-label="Previous track"></button>
      <button class="big" id="play" title="Play" aria-label="Play"></button>
      <button id="next" title="Next" aria-label="Next track"></button>
      <button id="repeat" title="Repeat" aria-label="Repeat"></button>
    </div>
    <div class="subcontrols">
      <button class="like" id="np-like" title="Like" aria-label="Like"></button>
      <button class="repost" id="np-repost" title="Repost" aria-label="Repost"></button>
      <button id="np-add" title="Add to playlist" aria-label="Add to playlist"></button>
      <button id="np-comments" title="Comments" aria-label="Comments"></button>
      <button id="vol-btn" title="Mute" aria-label="Mute"></button>
      <input type="range" id="vol" min="0" max="1" step="0.01" value="1" aria-label="Volume">
      <button id="open-sc" title="Open on SoundCloud" aria-label="Open on SoundCloud"></button>
    </div>
    <div class="fxrow">
      <button class="fx-pill" id="np-eq" title="Equalizer (Ctrl+Shift+E)" aria-haspopup="dialog"><span class="ic" id="np-eq-ic"></span><span class="lbl">EQ</span><span class="val" id="np-eq-val">Off</span></button>
      <button class="fx-pill" id="np-speed" title="Speed and pitch (Ctrl+Shift+S)" aria-haspopup="dialog"><span class="ic" id="np-speed-ic"></span><span class="lbl">Speed</span><span class="val" id="np-speed-val">1.00×</span></button>
    </div>
    <div class="queue-head"><h3>Up next</h3><span id="q-count"></span></div>
    <div class="queue" id="queue"></div>
  </aside>
</div>
<div class="modal" id="modal" hidden></div>
<div class="toast" id="toast" role="status"></div>
<audio id="audio" preload="auto"></audio>
<script src="icons.js"></script>
<script src="fx.js"></script>
<script src="app.js"></script>
</body>
</html>
